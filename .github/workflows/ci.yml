name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run tests
        run: npm test
        env:
          DB_PATH: ':memory:'
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: benni-operator-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # DEPLOY — Railway
  # Activate: set secret RAILWAY_TOKEN in repo settings.
  # -------------------------------------------------------------------------
  deploy-railway:
    name: Deploy → Railway
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_TARGET == 'railway'
    environment:
      name: production
      url: ${{ vars.RAILWAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # -------------------------------------------------------------------------
  # DEPLOY — Fly.io
  # Activate: set secret FLY_API_TOKEN + add fly.toml to repo root.
  # -------------------------------------------------------------------------
  deploy-fly:
    name: Deploy → Fly.io
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_TARGET == 'fly'
    environment:
      name: production
      url: https://${{ vars.FLY_APP_NAME }}.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # -------------------------------------------------------------------------
  # DEPLOY — VPS via SSH
  # Activate: set secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (opt).
  # Assumes Docker + docker-compose installed on the VPS.
  # -------------------------------------------------------------------------
  deploy-vps:
    name: Deploy → VPS (SSH)
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_TARGET == 'vps'
    environment:
      name: production
      url: https://${{ vars.VPS_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop benni-gateway || true
            docker rm   benni-gateway || true
            docker run -d \
              --name benni-gateway \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e DB_PATH=/data/benni.db \
              -e GATEWAY_API_KEY=${{ secrets.GATEWAY_API_KEY }} \
              -e JULES_API_KEY=${{ secrets.JULES_API_KEY }} \
              -e JARVAS2_BASE_URL=${{ secrets.JARVAS2_BASE_URL }} \
              -e JARVAS2_API_KEY=${{ secrets.JARVAS2_API_KEY }} \
              -v benni-data:/data \
              ghcr.io/${{ github.repository }}:latest
            docker image prune -f
